[project]
name = "trading-rookie"
version = "0.1.0"
description = "RookieTrader: FastAPI backend + Next.js frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pandas>=2",
  "numpy>=1.26",
  "requests>=2.31",
  "pandas-datareader>=0.10",
  "apscheduler>=3.10",
]

[project.scripts]
start = "trading_rookie.start:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
